<script type="text/javascript">
/* Site-wide byline layout (referenced from _site.yml as an after_body include).

   Distill renders its byline (Author / Published / Citation) as a band below
   the post description, built by Distill's own JS at load time. Rather than
   fight that layout, we wait for the page to finish loading, lift the author(s)
   and date into a single compact line placed directly under the title, and
   hide the original byline and its separator rules.

   Scoped naturally to post pages: <d-byline> only exists on articles. If
   anything here fails, the page simply keeps Distill's default byline. */
window.addEventListener('load', function () {
  var byline = document.querySelector('d-byline');
  var h1 = document.querySelector('d-title h1') || document.querySelector('h1');
  if (!byline || !h1 || document.querySelector('.post-byline')) return;

  // Collect every author name (a post may have more than one). Require at least
  // one author: this is what distinguishes a blog post from a top-level page
  // (packages, extras, resources, ...), which carries an empty byline. Without
  // this gate, Distill's "Not published yet." placeholder on those pages would
  // be treated as a post date.
  var names = [].slice.call(byline.querySelectorAll('.author a.name, .author .name'))
    .map(function (n) { return n.textContent.trim(); })
    .filter(Boolean);
  if (!names.length) return;

  // Find the published date by its field label, so a DOI/Citation column can't
  // shift a positional index onto the wrong value. Ignore Distill's
  // "Not published yet." placeholder shown when no date is set.
  var date = '';
  [].slice.call(byline.querySelectorAll('.byline > div')).forEach(function (d) {
    var label = d.querySelector('h3');
    if (label && /published/i.test(label.textContent)) {
      var p = d.querySelector('p');
      if (p) date = p.textContent.trim();
    }
  });
  if (/not published yet/i.test(date)) date = '';

  var parts = [];
  if (names.length) parts.push(names.join(', '));
  if (date) parts.push(date);

  var line = document.createElement('p');
  line.className = 'post-byline';
  line.textContent = parts.join('  ·  ');   // middot separator
  h1.insertAdjacentElement('afterend', line);

  // Mark this as a post page so post-only styling (e.g. the tightened gap
  // between the description and the opening image) can scope to it without
  // affecting top-level pages, which have no author/date byline.
  document.body.classList.add('distill-post');

  byline.style.display = 'none';
  [].slice.call(document.querySelectorAll('hr.section-separator')).forEach(function (hr) {
    hr.style.display = 'none';
  });
});
</script>
