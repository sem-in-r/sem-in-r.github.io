name: "SEMinR Website"
title: "SEMinR"
description: |
  SEMinR's Homepage and Blog
output_dir: "_build/docs"
base_url: https://seminr.io/
favicon: images/seminr_logos/favicon.png
# `theme:` applies site-wide INCLUDING blog posts (unlike the `css:` under
# output below, which only reaches top-level pages). Both point at the same
# stylesheet so the navbar centering and widened layout are consistent on every
# page. See CLAUDE.md / the multilang post for why posts don't inherit `css:`.
theme: styles.css
include: [".nojekyll", "CNAME"]
navbar:
  logo:
    image: images/seminr_logos/seminr-logo-white.png
    href: index.html
  search: false
  right:
    - text: "Packages"
      href: packages.html
    - text: "News"
      href: posts.html
    - text: "Extras"
      href: extras.html
    - text: "Resources"
      href: resources.html
    - text: "Community"
      href: community.html
output:
  distill::distill_article:
    css: styles.css
    includes:
      after_body: _includes/byline-under-title.html