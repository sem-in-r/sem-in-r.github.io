name: "SEMinR Website"
title: "SEMinR"
description: |
  SEMinR's Homepage and Blog
output_dir: "_build/docs"
base_url: https://seminr.io/
favicon: images/seminr_logos/favicon.png
# `theme:` applies styles.css site-wide INCLUDING blog posts, inlining it into
# every page at build time. We use it INSTEAD of `css:` under output (which only
# reaches top-level pages, not `_posts/`). See CLAUDE.md's Styling section.
theme: styles.css
include: [".nojekyll", "CNAME"]
navbar:
  logo:
    image: images/seminr_logos/seminr-logo-white.png
    href: index.html
  search: false
  right:
    - text: "Packages"
      href: packages.html
    - text: "News"
      href: posts.html
    - text: "Extras"
      href: extras.html
    - text: "Resources"
      href: resources.html
    - text: "Community"
      href: community.html
output:
  distill::distill_article:
    includes:
      after_body: _includes/byline-under-title.html